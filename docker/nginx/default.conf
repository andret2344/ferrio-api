server {
    # 8080, not 80: the container runs as the non-root nginx user and cannot bind a privileged
    # port. compose.yaml publishes it on the host loopback only.
    listen 8080;
    server_name _;
    root /app/public;

    # Encore builds versioned file names in production, so a file under /build never changes.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # Any other .php file is a scanner probing for one; there is a single front controller.
    location ~ \.php$ {
        return 404;
    }

    client_max_body_size 1m;
}
