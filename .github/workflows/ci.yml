name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.5' ]

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3, pdo_sqlite, intl
          coverage: none

      - name: Get Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  contract-immutability:
    name: Contract fixtures are append-only
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history needed for merge-base

      - name: Check frozen fixtures are append-only
        run: |
          git fetch origin main --quiet || true

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # push straight to main: compare the pre-push tip with the new one
            base="${{ github.event.before }}"
          else
            # PR or feature branch: the point where it diverged from main
            base="$(git merge-base origin/main HEAD)"
          fi

          # new branch / missing base (all-zeros) — fall back to merge-base
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git merge-base origin/main HEAD)"
          fi

          changed=$(git diff --no-renames --diff-filter=MD --name-only "$base" HEAD -- tests/Contract/data/)
          if [ -n "$changed" ]; then
            echo "::error::Frozen contract fixtures are append-only — these were modified or deleted:"
            echo "$changed"
            exit 1
          fi
          echo "OK — no frozen fixture touched."
