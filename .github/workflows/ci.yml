name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.5' ]

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3, pdo_sqlite, intl
          coverage: none

      - name: Get Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  contract-immutability:
    name: Contract fixtures are append-only
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # full history needed for merge-base

      - name: Check frozen fixtures are append-only
        run: |
          git fetch origin main --quiet || true

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # push straight to main: compare the pre-push tip with the new one
            base="${{ github.event.before }}"
          else
            # PR or feature branch: the point where it diverged from main
            base="$(git merge-base origin/main HEAD)"
          fi

          # new branch / missing base (all-zeros) — fall back to merge-base
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git merge-base origin/main HEAD)"
          fi

          changed=$(git diff --no-renames --diff-filter=MD --name-only "$base" HEAD -- tests/Contract/data/)
          if [ -n "$changed" ]; then
            echo "::error::Frozen contract fixtures are append-only — these were modified or deleted:"
            echo "$changed"
            exit 1
          fi
          echo "OK — no frozen fixture touched."

  destructive-migrations:
    name: Migrations survive the running release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The runner's preinstalled PHP is enough: the script reads files, it does not boot the app.
      - name: Check migrations for unmarked destructive changes
        run: php .github/scripts/check-destructive-migrations.php migrations

  # CI publishes a release, it never deploys one: every green push to main gets its images, and the
  # deploy is `deploy.sh <sha>` run by hand on the server (DEPLOY.md). Nothing here can reach the
  # server, so GitHub holds no key to it. Pull requests never publish.
  image:
    name: Build & push images (GHCR)
    needs: [ test, contract-immutability, destructive-migrations ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Two images per release, tagged with the full commit SHA - the only tag deploy.sh accepts, so
      # a release is always one exact commit and a rollback is that commit's SHA.
      - name: Build & push php image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: php
          push: true
          tags: ghcr.io/andret2344/ferrio-api-php:${{ github.sha }}
          cache-from: type=gha,scope=php
          cache-to: type=gha,mode=max,scope=php

      - name: Build & push nginx image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          push: true
          tags: ghcr.io/andret2344/ferrio-api-nginx:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # The run's summary page shows the command, ready to copy - the SHA is the only input
      # deploy.sh takes, and this is the run that proved that commit green and published it.
      - name: Print the deploy command
        run: |
          cmd="sudo /opt/ferrio-api/deploy.sh ${GITHUB_SHA}"
          echo "Release published. Deploy it on the server with: $cmd"
          printf '### Deploy\n\nRelease published. On the server:\n\n```\n%s\n```\n' "$cmd" >> "$GITHUB_STEP_SUMMARY"
