monolog:
  channels:
    - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
    - reports # Rejected report POSTs (bans, missing language/metadata, validation errors) — separate file for abuse stats

when@dev:
  monolog:
    handlers:
      main:
        type: stream
        path: "%kernel.logs_dir%/%kernel.environment%.log"
        level: debug
        channels: [ "!event" ]
      console:
        type: console
        process_psr_3_messages: false
        channels: [ "!event", "!doctrine", "!console" ]

when@test:
  monolog:
    handlers:
      main:
        type: fingers_crossed
        action_level: critical
        handler: nested
        excluded_http_codes: [ 400, 404, 405, 422 ]
        channels: [ "!event" ]
      nested:
        type: stream
        path: "%kernel.logs_dir%/%kernel.environment%.log"
        level: debug

when@prod:
  monolog:
    handlers:
      main:
        type: fingers_crossed
        # warning, not error: the app's own warnings (ApiHitCounter, FirebaseUserLookup) never come
        # with an error in the same request, so at error they were buffered and silently dropped.
        # Symfony logs 4xx HTTP exceptions at error, so this adds no scanner noise.
        action_level: warning
        handler: nested
        excluded_http_codes: [ 404, 405 ]
        channels: [ "!deprecation", "!reports" ]
        buffer_size: 50 # How many messages should be saved? Prevent memory leaks
      nested:
        type: stream
        path: php://stderr
        level: debug
        formatter: monolog.formatter.json
      console:
        type: console
        process_psr_3_messages: false
        channels: [ "!event", "!doctrine" ]
      deprecation:
        type: stream
        channels: [ deprecation ]
        path: php://stderr
        formatter: monolog.formatter.json
      reports:
        type: stream
        channels: [ reports ]
        path: "%kernel.logs_dir%/reports.log"
        level: info
        formatter: monolog.formatter.json
